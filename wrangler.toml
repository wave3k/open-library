name = "open-library"
compatibility_date = "2026-10-07"
main = "worker/index.js"

# ---- Production : déploiement UNIQUEMENT sur demande explicite ----
[[d1_databases]]
binding = "DB"
database_name = "plume-db"
database_id = "34cfc80a-6dc3-4665-9711-6d30f3aa79ca"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "open-library-media"

# ---- Staging : environnement de test (données séparées) ----
[env.staging]
name = "open-library-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "plume-db-staging"
database_id = "c1a2109a-9abc-4bec-8f30-0481df6330ce"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "open-library-media-staging"
